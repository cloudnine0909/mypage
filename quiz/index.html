<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧬 해부학 퀴즈 생성기</title>
  <link rel="stylesheet" href="style.css" />
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Tesseract.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <a href="../index.html" class="back-btn">← 돌아가기</a>
    <div class="header-content">
      <h1>🧬 해부학 퀴즈 생성기</h1>
      <p class="subtitle">PDF 또는 이미지를 업로드하면 AI가 자동으로 퀴즈를 생성합니다</p>
    </div>
  </header>

  <main class="container">

    <!-- Upload Section -->
    <section id="upload-section">

      <div id="drop-zone" role="button" tabindex="0" aria-label="파일 업로드 영역">
        <div class="drop-zone-inner">
          <div class="upload-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
              <rect width="64" height="64" rx="16" fill="#eef2ff"/>
              <path d="M32 40V24M32 24L26 30M32 24L38 30" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M20 44h24" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M16 36a8 8 0 0 1 0-16c.3 0 .6 0 .9.02A10 10 0 0 1 32 14a10 10 0 0 1 9.9 8.57A6 6 0 1 1 46 34H16z" fill="#c7d2fe" stroke="#6366f1" stroke-width="1.5"/>
            </svg>
          </div>
          <p class="drop-zone-title">파일을 여기에 드래그하거나 클릭하여 업로드</p>
          <p class="drop-zone-hint">지원 형식: PDF, JPG, PNG, WEBP, GIF</p>
          <span class="drop-zone-btn">파일 선택</span>
        </div>
        <input id="file-input" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.gif" hidden />
      </div>

      <div id="options-panel" class="card">
        <h3 class="options-title">퀴즈 설정</h3>
        <div class="options-grid">

          <div class="option-group">
            <label for="lang-select" class="option-label">OCR 언어</label>
            <select id="lang-select" class="option-select">
              <option value="kor+eng">한국어 + 영어</option>
              <option value="eng">영어</option>
              <option value="kor">한국어</option>
            </select>
          </div>

          <div class="option-group">
            <label for="question-count" class="option-label">
              문제 수: <span id="count-display">10</span>개
            </label>
            <input id="question-count" type="range" min="5" max="30" value="10" class="option-range" />
            <div class="range-labels">
              <span>5</span>
              <span>30</span>
            </div>
          </div>

          <div class="option-group option-group--checkboxes">
            <span class="option-label">문제 유형</span>
            <div class="checkbox-list">
              <label class="checkbox-label">
                <input type="checkbox" id="type-mcq" checked />
                <span class="checkbox-custom"></span>
                객관식 (MCQ)
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="type-tf" checked />
                <span class="checkbox-custom"></span>
                참/거짓 (T/F)
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="type-blank" checked />
                <span class="checkbox-custom"></span>
                빈칸 채우기
              </label>
            </div>
          </div>

        </div>

        <div class="generate-row">
          <button id="generate-btn" class="btn btn--primary" disabled>
            <span class="btn-icon">✨</span> 퀴즈 생성하기
          </button>
        </div>
      </div>

    </section>

    <!-- Processing Section -->
    <section id="processing-section" hidden>
      <div class="processing-card card">
        <div class="spinner"></div>
        <p id="status-text" class="status-text">처리 중...</p>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
        </div>
      </div>
    </section>

    <!-- Text Preview Section -->
    <section id="text-preview-section" hidden>
      <div class="card">
        <div class="preview-header">
          <h3>추출된 텍스트 미리보기</h3>
          <button id="regenerate-btn" class="btn btn--outline">
            🔄 퀴즈 다시 생성
          </button>
        </div>
        <div id="text-preview" class="text-preview"></div>
      </div>
    </section>

    <!-- Quiz Section -->
    <section id="quiz-section" hidden>

      <div id="quiz-header" class="quiz-header card">
        <h2>퀴즈</h2>
        <span id="quiz-progress" class="quiz-progress"></span>
        <div class="quiz-actions">
          <button id="submit-quiz-btn" class="btn btn--primary">제출</button>
          <button id="print-btn" class="btn btn--outline print-btn">🖨️ 인쇄</button>
        </div>
      </div>

      <div id="quiz-container"></div>

      <div id="quiz-result" hidden>
        <div class="card result-card">
          <h3 class="result-title">퀴즈 결과</h3>
          <div id="score-display" class="score-display"></div>
          <div class="result-actions">
            <button id="retry-btn" class="btn btn--outline">🔁 다시 풀기</button>
            <button id="new-quiz-btn" class="btn btn--primary">📄 새 퀴즈</button>
          </div>
        </div>
      </div>

    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>🔒 모든 처리는 브라우저에서 로컬로 실행됩니다</p>
  </footer>

  <!-- Local Scripts -->
  <script src="js/pdf-processor.js"></script>
  <script src="js/image-processor.js"></script>
  <script src="js/quiz-generator.js"></script>
  <script src="js/quiz-renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
